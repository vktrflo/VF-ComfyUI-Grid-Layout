name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Extract changelog for current version
        id: changelog
        shell: python
        run: |
          import os, pathlib, re, tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]["version"]
          changelog_path = pathlib.Path("CHANGELOG.md")
          notes = ""
          if changelog_path.exists():
              text = changelog_path.read_text("utf-8")
              pattern = rf"^##\s+\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^##\s+\[?v?\d|\Z)"
              match = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
              if match:
                  notes = match.group(1).strip()

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"COMFY_NODE_CHANGELOG<<EOF\n{notes}\nEOF\n")
          print(f"Extracted changelog for v{version}:\n{notes}")

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: 'true'
